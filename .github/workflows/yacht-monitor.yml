name: OK-Boats yacht market source monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Recover completed Nov 4 runs (no new Actors), or start new live runs'
        type: choice
        required: true
        default: recover
        options:
          - recover
          - live
  schedule:
    # 07:23 UTC = 10:23 Europe/Istanbul, daily
    - cron: '23 7 * * *'

permissions:
  contents: write

concurrency:
  group: yacht-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Validate
        run: |
          python -m monitor.main --check-config
          python -m unittest discover -s tests -v
      - name: Check token
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo '::error::Missing APIFY_TOKEN in repository Actions secrets.'
            exit 1
          fi
      - name: Collect or recover Apify results
        id: collect
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
        run: |
          if [ "$RUN_MODE" = "recover" ]; then
            echo 'Recovering prior Actor datasets without starting new Actors'
            python -m monitor.main --recover-first-run
          else
            echo 'Starting new Actors; Apify usage can incur charges'
            python -m monitor.main
          fi
      - name: Commit observations and statuses
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily market monitoring observation'
            git push
          else
            echo 'No new data.'
          fi
      - name: Report partial failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::One or more sources failed. See data/runs.jsonl.'
          exit 1
